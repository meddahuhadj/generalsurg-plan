<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — ORLSurgPlan3D</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <style>
    /* ── Design System ────────────────────────────────────────────── */
    :root {
      --bg-deep:    #0a1929;
      --bg-card:    #102235;
      --bg-glass:   rgba(16, 34, 53, 0.85);
      --accent:     #38bdf8;
      --accent-2:   #818cf8;
      --text:       #e2e8f0;
      --text-muted: #94a3b8;
      --border:     rgba(148, 163, 184, 0.12);
      --danger:     #f87171;
      --warning:    #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Animated background orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #38bdf8, transparent);
      top: -150px; left: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #818cf8, transparent);
      bottom: -100px; right: -80px;
      animation-delay: -4s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #f87171, transparent);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -2s;
      opacity: 0.08;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-20px) scale(1.04); }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 10;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(56, 189, 248, 0.08),
        0 32px 64px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(56, 189, 248, 0.05);
      animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Icon */
    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(248, 113, 113, 0.12);
      border: 1.5px solid rgba(248, 113, 113, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      animation: pulse-ring 2.5s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.2); }
      50%       { box-shadow: 0 0 0 12px rgba(248, 113, 113, 0); }
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .brand-logo {
      font-size: 1.2rem;
    }
    .brand-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .description {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Status indicator */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      color: var(--danger);
      margin-bottom: 1.5rem;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Retry button */
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 24px rgba(56, 189, 248, 0.25);
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(56, 189, 248, 0.4);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .btn-retry svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }
    .btn-retry:hover svg {
      transform: rotate(180deg);
    }

    /* Footer note */
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="card">

    <div class="brand">
      <span class="brand-logo">🏥</span>
      <span class="brand-name">ORLSurgPlan3D</span>
    </div>

    <div class="icon-wrap">📡</div>

    <h1>Vous êtes hors ligne</h1>

    <p class="description">
      La connexion réseau est introuvable. L'application nécessite une
      connexion pour accéder aux dossiers patients, aux modules d'IA et
      aux données DICOM.
    </p>

    <div class="status-bar">
      <span class="status-dot"></span>
      Réseau non disponible
    </div>

    <button class="btn-retry" id="btn-retry" onclick="retryConnection()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Réessayer la connexion
    </button>

    <p class="footer-note">
      ⚠ Prototype de démonstration — Usage pédagogique uniquement
    </p>

  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('btn-retry');
      btn.disabled = true;
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"
             style="animation: spin 0.8s linear infinite;">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        Connexion en cours…
      `;

      // Tentative de rechargement après un court délai
      setTimeout(() => {
        window.location.href = '/';
      }, 800);
    }

    // Détection du retour en ligne → redirection automatique
    window.addEventListener('online', () => {
      window.location.href = '/';
    });

    // Injection du style de spin inline (évite une feuille de style externe)
    const style = document.createElement('style');
    style.textContent = `@keyframes spin { to { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
  </script>

</body>
</html>
