# ==============================================================================
# docker-compose.yml — OphtalmoSurg Plan Enterprise Stack
# ==============================================================================
# Architecture complète et résiliente pour centre de cancérologie et hôpital universitaire.
# Inclut :
#   1. caddy    : reverse proxy HTTPS automatique (Let's Encrypt) — seul point
#                 d'entrée public (ports 80/443). Requis pour que le service
#                 worker PWA (voir sw.js) fonctionne en dehors de localhost.
#   2. backend  : API FastAPI hautement disponible (Jumeaux 3D, MONAI, Biomécanique, Dictée CCAM)
#   3. postgres : Base de données relationnelle sécurisée avec extension pgvector (Recherche sémantique & IA)
#   4. orthanc  : Serveur PACS DICOMweb certifié pour l'imagerie médicale hospitalière
#
# Sécurité réseau : seul Caddy publie des ports sur l'hôte (80/443). backend et
# postgres restent joignables UNIQUEMENT via le réseau Docker interne
# hospital_secure_net — avant cette révision, postgres:5432 et backend:8000
# étaient publiés directement sur l'hôte, donc potentiellement exposés à
# Internet sur un VPS sans pare-feu configuré. orthanc:4242 (protocole DICOM
# C-STORE, pas HTTP — Caddy ne peut pas le reverse-proxyer) reste publié
# volontairement pour l'intégration PACS réelle depuis le réseau hospitalier ;
# orthanc:8042 (interface HTTP/DICOMweb) redevient interne, déjà atteint par
# le backend via http://orthanc:8042.

services:
  caddy:
    image: caddy:2-alpine
    container_name: ophtalmosurg_proxy
    restart: always
    environment:
      - DOMAIN=${DOMAIN:?Définissez DOMAIN (ex. ophtalmosurg.mondomaine.fr) dans .env — voir .env.example}
      - ACME_EMAIL=${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - hospital_secure_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ophtalmosurgplan-nextgen:2.4.0
    container_name: ophtalmosurg_app
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://surguser:${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans un fichier .env à la racine (voir .env.example) avant de lancer ce stack}@postgres:5432/ophtalmosurg_db
      - JWT_SECRET=${JWT_SECRET:?Définissez JWT_SECRET (ex. `openssl rand -hex 32`) dans .env avant la mise en production}
      - SEED_DEMO_USERS=false
      - ALLOWED_ORIGINS=https://${DOMAIN:?}
      - ORTHANC_URL=http://orthanc:8042
      - MESH_STORAGE_DIR=/tmp/storage/meshes_v2
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_started
    volumes:
      - surg_storage:/tmp/storage
    networks:
      - hospital_secure_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ophtalmosurg_db
    restart: always
    environment:
      - POSTGRES_USER=surguser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans un fichier .env à la racine (voir .env.example) avant de lancer ce stack}
      - POSTGRES_DB=ophtalmosurg_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surguser -d ophtalmosurg_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital_secure_net

  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: ophtalmosurg_pacs
    restart: always
    ports:
      - "4242:4242"   # Port DICOM C-STORE standard hospitalier (protocole DIMSE, pas HTTP)
    environment:
      - ORTHANC_NAME=OphtalmoSurgPlan_PACS
    volumes:
      - orthanc_storage:/var/lib/orthanc/db
    networks:
      - hospital_secure_net

volumes:
  pgdata:
    driver: local
  surg_storage:
    driver: local
  orthanc_storage:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  hospital_secure_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
